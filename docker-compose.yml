services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: barbearia-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barbearia_saas}
      POSTGRES_USER: ${POSTGRES_USER:-barbearia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Copy .env.example to .env and fill it.}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Aplicado automaticamente apenas no PRIMEIRO boot (volume vazio).
      # Para aplicar migrations em volume existente: ./migrate.sh ou ver README.
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barbearia} -d ${POSTGRES_DB:-barbearia_saas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: barbearia-redis
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required. Copy .env.example to .env and fill it.}
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Core API ────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: barbearia-api
    env_file: .env
    # Garante URLs da rede Docker mesmo que `.env` na máquina host esteja apontado para localhost (npm dev).
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-barbearia}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-barbearia_saas}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Compose local: baterias QA encadeiam muitos POST /auth/login no mesmo IP (valor fixo; produção usa outro compose).
      AUTH_LOGIN_RATE_LIMIT_MAX: "120"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  # ── Frontend Web ────────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Sem valor, o Vite embute string vazia e o login enviava tenant_id "" — UUID demo do seed.
        VITE_DEFAULT_TENANT_ID: ${VITE_DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
    container_name: barbearia-web
    ports:
      - "3001:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── n8n ─────────────────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:1.91.3
    container_name: barbearia-n8n
    ports:
      - "5679:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-barbearia_saas}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-barbearia}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Copy .env.example to .env and fill it.}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required. Copy .env.example to .env and fill it.}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?N8N_BASIC_AUTH_PASSWORD is required. Copy .env.example to .env and fill it.}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5679/}
      GENERIC_TIMEZONE: America/Sao_Paulo
      # Permite n8n chamar a API pelo nome interno do serviço Docker
      API_BASE_URL: http://api:3000
      # Token de autenticação usado pelo workflow para chamar o Core API
      # Deve corresponder ao webhook_token do tenant na tabela tenants
      # Default alinhado ao seed demo (`database/seeds/001_demo.sql`). Sobrescreva em `.env` em ambientes reais.
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-demo_webhook_token_change_me}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    # Basic Auth na UI — wget busybox pode não suportar credenciais; Node usa env sem interpolar senha no shell.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(\"http\").get({hostname:\"127.0.0.1\",port:5678,path:\"/healthz\",headers:{Authorization:\"Basic \"+Buffer.from((process.env.N8N_BASIC_AUTH_USER||\"admin\")+\":\"+(process.env.N8N_BASIC_AUTH_PASSWORD||\"\")).toString(\"base64\")}},r=>process.exit(r.statusCode===200?0:1)).on(\"error\",()=>process.exit(1));"',
        ]
      interval: 20s
      timeout: 15s
      retries: 8
      start_period: 90s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  n8n_data:
